schema_policy:
  require_inspection_before_prepare: true
  canonical_aliases:
    src_ip: ["IPV4_SRC_ADDR", "src_ip", "source_ip"]
    dst_ip: ["IPV4_DST_ADDR", "dst_ip", "destination_ip"]
    src_port: ["L4_SRC_PORT", "src_port", "source_port"]
    dst_port: ["L4_DST_PORT", "dst_port", "destination_port"]
    protocol: ["PROTOCOL", "protocol"]
    application_protocol: ["L7_PROTO", "application_protocol"]
    in_bytes: ["IN_BYTES", "in_bytes", "source_bytes"]
    out_bytes: ["OUT_BYTES", "out_bytes", "destination_bytes"]
    in_packets: ["IN_PKTS", "in_packets", "source_packets"]
    out_packets: ["OUT_PKTS", "out_packets", "destination_packets"]
    flow_duration_ms: ["FLOW_DURATION_MILLISECONDS", "flow_duration_ms", "duration_ms"]
    tcp_flags: ["TCP_FLAGS", "tcp_flags"]
    client_tcp_flags: ["CLIENT_TCP_FLAGS", "client_tcp_flags"]
    server_tcp_flags: ["SERVER_TCP_FLAGS", "server_tcp_flags"]
  always_exclude:
    - Label
    - label
    - Attack
    - attack
    - Dataset
    - dataset
  identifier_patterns: ["flow_id", "session_id", "record_id", "uuid"]
  high_cardinality_ratio: 0.98
  exclude_raw_identifiers: true
derived_features:
  enabled: true
  safe_division_epsilon: 0.000001
  features:
    - total_bytes
    - total_packets
    - bytes_per_packet
    - packets_per_second
    - bytes_per_second
    - direction_byte_ratio
    - direction_packet_ratio
    - packet_asymmetry
    - byte_asymmetry
