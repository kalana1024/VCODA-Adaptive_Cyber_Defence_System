[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcoda"
version = "1.0.0"
description = "Verifiable Cybersecurity-Oriented Detection and Adaptive Response Architecture"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "V-CODA Project"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "psutil>=5.9",
  "networkx>=3.2",
]

[project.optional-dependencies]
training = [
  "xgboost>=2.1",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "optuna>=3.6",
  "shap>=0.45",
  "pyarrow>=15",
  "scipy>=1.12",
  "imbalanced-learn>=0.12",
  "matplotlib>=3.8",
]
deep = ["torch>=2.2", "tensorboard>=2.16"]
streaming = ["river>=0.21"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dashboard = ["streamlit>=1.33", "plotly>=5.20"]
capture = ["scapy>=2.5", "pyshark>=0.6"]
cti = ["taxii2-client>=2.3"]
mlops = ["mlflow>=2.11"]
development = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.3"]
all = [
  "xgboost>=2.1", "lightgbm>=4.3", "catboost>=1.2", "optuna>=3.6",
  "shap>=0.45", "pyarrow>=15", "scipy>=1.12", "imbalanced-learn>=0.12", "matplotlib>=3.8",
  "torch>=2.2", "tensorboard>=2.16", "river>=0.21",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9",
  "streamlit>=1.33", "plotly>=5.20", "scapy>=2.5", "pyshark>=0.6",
  "mlflow>=2.11", "taxii2-client>=2.3", "pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.3"
]

[project.scripts]
vcoda = "vcoda.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
